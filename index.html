<!DOCTYPE html>
<html>
<head>
    <title>Countdown to December 9th</title>
    <style>
    body {
        background-color: #000000;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    #countdown {
        font-size: 48px;
        font-weight: bold;
        margin-top: 50px;
    }
    </style>
</head>
<body>
    <div style="width: 100%; border:4px solid white;height:650px;margin-top:30px;border-radius:20px;margin-right:2%; display: block; justify-content: center; align-items: center;">
        <img src="pic.png" style="width: 400px;height:300px;margin-top:50px">
        <div style="margin-top: 50px;font-size:2em;"><h1> Time till Shinkensen gets released</h1></div>
        <div id="countdown"></div>
    </div>

    <script>
    // Set the date we're counting down to
    const countDownDate = new Date("Dec 10, 2025 00:00:00").getTime();

    // Update the countdown every second
    const x = setInterval(function() {
      // Get today's date and time
        const now = new Date().getTime();

        // Find the distance between now and the countdown date
        const distance = countDownDate - now;

        // Time calculations
        const months = Math.floor(distance / (1000 * 60 * 60 * 24 * 30.44)); // average month length
        const days = Math.floor((distance % (1000 * 60 * 60 * 24 * 30.44)) / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // Display the result
        document.getElementById("countdown").innerHTML =
        months + "m " + days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

        // If the countdown is over
        if (distance < 0) {
        clearInterval(x);
        document.getElementById("countdown").innerHTML = "It's December 9th!";
        }

    }, 1000);
    </script>
</body>
</html>
